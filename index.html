      left: 3.5vw;
      right: 3.5vw;
      top: 50%;
      height: 1px;
      background: var(--vante-line);
      transform-origin: left;
      transform: scaleX(0);
      pointer-events: none;
      z-index: 4;
    }
    #vante-hint {
      position: absolute;
      left: 50%;
      top: 32px;
      transform: translateX(-50%);
      font: 400 11.5px 'IBM Plex Mono', monospace;
      letter-spacing: 0.06em;
      color: var(--vante-ink);
      mix-blend-mode: difference;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--vante-line);
      cursor: pointer;
      z-index: 25;
      transition: opacity 0.2s;
    }
    #vante-name {
      position: fixed;
      left: 0;
      top: 0;
      padding: 6px 12px;
      background: var(--vante-ink);
      color: var(--vante-bg);
      border-radius: 99px;
      font-family: 'Inter Tight', system-ui, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.16s ease-out;
      white-space: nowrap;
      z-index: 100;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .vante-bot {
      position: absolute;
      left: 32px;
      right: 32px;
      bottom: 24px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      font-size: 12px;
      line-height: 1.35;
      pointer-events: none;
      color: var(--vante-ink);
      z-index: 6;
      font-family: 'Inter Tight', system-ui, sans-serif;
    }
    .vante-bot p {
      color: var(--vante-ink);
      max-width: 22em;
      opacity: 0.8;
    }
    .vante-id-list {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 6px;
      max-width: 34em;
    }
    .vante-id-list-label {
      width: 100%;
      font: 400 11px 'IBM Plex Mono', monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 2px;
    }
    .vante-id-chip {
      font: 500 12px 'Inter Tight', system-ui, sans-serif;
      color: var(--vante-ink);
      background: rgba(8, 8, 10, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
      padding: 6px 11px;
      min-height: 30px;
      cursor: pointer;
      transition: background-color 0.2s cubic-bezier(0.16, 1, 0.3, 1), color 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .vante-id-chip:hover { background: #f4f4f5; color: #09090b; }
    .vante-bot .vante-mid {
      font: 400 11.5px 'IBM Plex Mono', monospace;
      letter-spacing: 0.06em;
      opacity: 0.7;
    }
    .vante-bot .vante-mid s {
      text-decoration: none;
      color: var(--vante-mid);
      margin: 0 0.9em;
    }
    .vante-bot .vante-r {
      justify-self: end;
      display: flex;
      gap: 12px;
      align-items: center;
      font: 400 11.5px 'IBM Plex Mono', monospace;
      letter-spacing: 0.06em;
      opacity: 0.7;
    }
    .vante-bot .vante-r:after {
      content: "";
      width: 22px;
      height: 1px;
      background: var(--vante-ink);
    }
    @media (max-width: 760px) {
      .vante-bot {
        left: 18px;
        right: 18px;
        bottom: 72px;
        grid-template-columns: 1fr auto;
      }
      .vante-bot .vante-mid { display: none; }
      #vante-hint { display: none; }
      .vante-bot p { max-width: 17em; font-size: 11px; }
      .vante-id-chip { font-size: 11px; padding: 6px 11px; flex-shrink: 0; min-height: 44px; }
      .vante-bot nav.vante-id-list { flex-wrap: nowrap; overflow-x: auto; min-width: 0; max-width: 100%; scrollbar-width: none; padding-bottom: 2px; }
      .vante-bot nav.vante-id-list::-webkit-scrollbar { display: none; }
      .vante-id-list-label { display: none; }
    }

    /* ===== Padrões globais: foco, seleção, doodles, movimento reduzido ===== */
    ::selection { background: #34d399; color: #08080a; }
    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid #34d399;
      outline-offset: 3px;
      border-radius: 6px;
    }
    /* Tinta dos doodles do Mago: laranja + branco, sombra com deslocamento (sem neon) */
    .doodle { filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.55)); }
    .doodle-ink { color: #ff7500; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    /* Mobile: cilindro dos Estáticos mais leve (só a face da frente, sem blur/filtro/sombras pesadas) */
    @media (max-width: 767px) {
      #estaticos-section [data-layer="mid"],
      #estaticos-section [data-layer="back"] { display: none !important; }
      #estaticos-section [data-layer="front"] {
        box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.85) !important;
        transition: none !important;
      }
      #estaticos-section [data-layer="front"] img { filter: none !important; }
      #estaticos-section .backdrop-blur-md { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }
    /* Mobile: colunas dos Estáticos em movimento contínuo (animação só de transform, roda no compositor) */
    .static-marquee {
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 9%, #000 88%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 9%, #000 88%, transparent 100%);
    }
    .static-marquee-tilt { transform: rotateX(10deg) scale(1.06); transform-origin: 50% 40%; }
    .static-marquee-col {
      animation-name: staticMarquee;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform;
      backface-visibility: hidden;
    }
    @keyframes staticMarquee {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(0, calc(-50% - 5px), 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .static-marquee-col { animation: none !important; }
    }
    /* Toque: sem flash azul e sem atraso de duplo toque */
    a, button, [role="button"] { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  </style>
</head>
